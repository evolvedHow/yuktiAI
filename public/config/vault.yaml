# Key Vault — access control

The Key Vault (Settings → 🔑 Key Vault) is where the LLM API keys, gateway URL and model
settings live. By default the vault is password-protected so a visitor to the site cannot
open it and change who is paying for the debates.

The password is "baked in" to this file at build time. That is obfuscation, not real
security — this is a static site and the file ships to every browser — so treat it as a
lock on casual fiddling, not as a hardened secret. The API keys themselves are still best
held by the Cloudflare Worker (worker/), which never reveals them to the browser.

To change the vault password, edit `password:` here and redeploy. To disable the lock,
set it to an empty string.

