[project]
name = "yukti-backend"
version = "0.1.0"
description = "YuktiAI OpenAI-compatible LLM proxy that sources its key from the worker-env vault."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "worker-env @ git+https://github.com/evolvedHow/worker-env.git@7b739a47425194311fd0e77b1929bfbff420028f",
]
