# Builds the static site and deploys it to GitHub Pages on every push to `main`.
# VITE_BACKEND_URL etc. come in as repository variables at build time; nothing
# secret is ever baked into the bundle — the gateway holds every provider key
# server-side. See README.md → "Deploy to GitHub Pages".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          # ── LLM gateway (the only mode) ───────────────────────────────────
          # URL of the shared worker-env gateway. Baking this in means users get
          # working keys with no setup, and no key ships in the bundle.
          # Store as a repository *variable* — it isn't secret.
          VITE_BACKEND_URL:       ${{ vars.VITE_BACKEND_URL }}
          VITE_GATEWAY_PROVIDER:  ${{ vars.VITE_GATEWAY_PROVIDER }}
          # Model the gateway uses if the user doesn't override it.
          VITE_LLM_MODEL:         ${{ vars.VITE_LLM_MODEL }}

          # ── Pacing / reveal defaults ───────────────────────────────────────
          VITE_MAX_TOKENS:        ${{ vars.VITE_MAX_TOKENS }}
          VITE_MAX_TURNS:         ${{ vars.VITE_MAX_TURNS }}
          VITE_TURN_DELAY_MS:     ${{ vars.VITE_TURN_DELAY_MS }}
          VITE_AUTO_ADVANCE:      ${{ vars.VITE_AUTO_ADVANCE }}
          VITE_TYPEWRITER:        ${{ vars.VITE_TYPEWRITER }}
          VITE_TYPEWRITER_MODE:   ${{ vars.VITE_TYPEWRITER_MODE }}
          VITE_TYPEWRITER_RATE:   ${{ vars.VITE_TYPEWRITER_RATE }}

          # ── Accuracy / fact-checking ───────────────────────────────────────
          VITE_EVIDENCE_POLICY:   ${{ vars.VITE_EVIDENCE_POLICY }}
          VITE_VERIFY_LINKS:      ${{ vars.VITE_VERIFY_LINKS }}
          VITE_REVIEW_CLAIMS:     ${{ vars.VITE_REVIEW_CLAIMS }}
          VITE_MAX_REDOS:         ${{ vars.VITE_MAX_REDOS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
