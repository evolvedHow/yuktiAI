name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          # ── Key gateway (recommended) ──────────────────────────────────────
          # URL of the Cloudflare Worker in worker/. Baking this in means users
          # get working keys with no setup, and no key ships in the bundle.
          # Store as a repository *variable* — it isn't secret.
          VITE_BACKEND_URL:       ${{ vars.VITE_BACKEND_URL }}
          VITE_GATEWAY_PROVIDER:  ${{ vars.VITE_GATEWAY_PROVIDER }}

          # ── Direct provider mode (only when no gateway is set) ─────────────
          # WARNING: VITE_LLM_API_KEY is embedded in the published JavaScript and
          # is readable by anyone who visits the site. Prefer the gateway above.
          VITE_LLM_BASE_URL:      ${{ secrets.VITE_LLM_BASE_URL }}
          VITE_LLM_API_KEY:       ${{ secrets.VITE_LLM_API_KEY }}
          VITE_LLM_MODEL:         ${{ secrets.VITE_LLM_MODEL }}

          # ── Pacing / reveal defaults ───────────────────────────────────────
          VITE_MAX_TOKENS:        ${{ vars.VITE_MAX_TOKENS }}
          VITE_MAX_TURNS:         ${{ vars.VITE_MAX_TURNS }}
          VITE_TURN_DELAY_MS:     ${{ vars.VITE_TURN_DELAY_MS }}
          VITE_AUTO_ADVANCE:      ${{ vars.VITE_AUTO_ADVANCE }}
          VITE_TYPEWRITER:        ${{ vars.VITE_TYPEWRITER }}
          VITE_TYPEWRITER_MODE:   ${{ vars.VITE_TYPEWRITER_MODE }}
          VITE_TYPEWRITER_RATE:   ${{ vars.VITE_TYPEWRITER_RATE }}

          # ── Accuracy / fact-checking ───────────────────────────────────────
          VITE_EVIDENCE_POLICY:   ${{ vars.VITE_EVIDENCE_POLICY }}
          VITE_VERIFY_LINKS:      ${{ vars.VITE_VERIFY_LINKS }}
          VITE_REVIEW_CLAIMS:     ${{ vars.VITE_REVIEW_CLAIMS }}
          VITE_MAX_REDOS:         ${{ vars.VITE_MAX_REDOS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
